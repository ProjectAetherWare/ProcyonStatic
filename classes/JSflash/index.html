<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flash Library</title>
<script src="ruffle.js"></script>
<style>
:root{
  --bg:#0f1720; --panel:#15232f; --accent:#66c0f4; --text:#d7e7ef;
}
body{margin:0;padding:0;font-family:Arial,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);}
#topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:#0d1620;border-bottom:1px solid rgba(255,255,255,0.03);}
#topbar .title{font-weight:700;font-size:20px;color:var(--accent);}
#topbar .controls{display:flex;gap:8px;align-items:center;}
.input{padding:6px 10px;border-radius:6px;background:#172733;border:1px solid rgba(255,255,255,0.02);color:var(--text);outline:none;}
.btn{padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.04);background:#1b2f3e;color:var(--accent);cursor:pointer;}
.btn:hover{transform:translateY(-1px);}
#libraryWrap{padding:12px;height:180px;display:flex;flex-direction:column;gap:6px;}
#dropHint{height:50px;border-radius:6px;border:2px dashed rgba(255,255,255,0.03);display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);font-size:12px;}
#library{display:flex;gap:12px;overflow-x:auto;padding:6px 2px;align-items:center;}
#library::-webkit-scrollbar{height:10px;}
#library::-webkit-scrollbar-thumb{background:#24343f;border-radius:6px;}
.card{flex:0 0 160px;height:120px;background:var(--panel);border-radius:6px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .15s, box-shadow .15s;position:relative;}
.card:hover{transform:translateY(-3px);box-shadow:0 0 15px rgba(102,192,244,0.4);}
.cover{height:80px;border-radius:4px;background:#000;background-size:cover;background-position:center;}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:4px;}
.card .name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card .cardBtn{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.5);color:#fff;font-size:11px;padding:2px 4px;border-radius:3px;cursor:pointer;}
.card .cardBtn:hover{background:var(--accent);color:#000;}
#playerArea{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;z-index:50;display:none;}
#playerContainer{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
ruffle-player{width:100%;height:100%;display:block;}
#controlBar{position:fixed;left:0;right:0;bottom:-72px;height:72px;background:#081017;border-top:2px solid rgba(102,192,244,0.12);display:flex;align-items:center;justify-content:space-between;padding:8px 20px;transition:bottom .2s;z-index:100;}
#barToggle{position:fixed;left:50%;transform:translateX(-50%);bottom:0;background:var(--accent);color:#002;margin:6px;padding:6px 12px;border-radius:6px 6px 0 0;cursor:pointer;z-index:101;}
.bar-left{display:flex;gap:8px;align-items:center;}
.bar-right{display:flex;gap:8px;align-items:center;}
</style>
</head>
<body>

<div id="topbar">
  <div class="title">Flash Library</div>
  <div class="controls">
    <input id="search" class="input" placeholder="Search..." oninput="renderLibrary()">
    <button class="btn" id="uploadBtn">Upload</button>
    <input type="file" id="swfPicker" accept=".swf" style="display:none">
    <button class="btn" id="downloadAllBtn">Download All</button>
    <select id="themeSelect" class="input">
      <option value="dark">Dark</option>
      <option value="light">Light</option>
      <option value="blue">Blue</option>
    </select>
  </div>
</div>

<div id="libraryWrap">
  <div id="dropHint">Drag & drop SWF files here</div>
  <div id="library"></div>
</div>

<div id="playerArea">
  <div id="playerContainer"></div>
</div>

<div id="controlBar">
  <div class="bar-left">
    <div id="barGameTitle" style="font-weight:700">No game</div>
  </div>
  <div class="bar-right">
    <button class="small" id="favBtn">☆ Favorite</button>
    <button class="small" id="closeBtn">✕ Close</button>
  </div>
</div>
<div id="barToggle">▲</div>

<script>
const LS_INDEX_KEY='flash_launcher_index';
let index=[], currentId=null, barOpen=false;
const libraryEl=document.getElementById('library');
const playerContainer=document.getElementById('playerContainer');
const playerArea=document.getElementById('playerArea');
const ruffleLib = window.RufflePlayer && window.RufflePlayer.newest();

// IndexedDB
let db;
function openDB(){return new Promise((res,rej)=>{if(db) return res(db); const r=indexedDB.open('FlashLibraryDB',1); r.onupgradeneeded=e=>{e.target.result.createObjectStore('games',{keyPath:'id'});}; r.onsuccess=e=>{db=e.target.result; res(db);}; r.onerror=rej;});}
function storeGame(rec){return new Promise(async res=>{const d=await openDB();const tx=d.transaction('games','readwrite');tx.objectStore('games').put(rec);tx.oncomplete=()=>res(true);});}
function deleteGameDB(id){return new Promise(async res=>{const d=await openDB();const tx=d.transaction('games','readwrite');tx.objectStore('games').delete(id);tx.oncomplete=()=>res(true);});}
function loadAllGames(){return new Promise(async res=>{const d=await openDB();const tx=d.transaction('games','readonly');const store=tx.objectStore('games');let all=[];store.openCursor().onsuccess=e=>{const c=e.target.result;if(c){all.push(c.value);c.continue();}else{res(all);}};});}

// Load saved
loadAllGames().then(arr=>{index=arr.sort((a,b)=>b.favorite-b.favorite); renderLibrary();});

// Helpers
function uid(){return 'g_'+Math.random().toString(36).slice(2,10);}
function getGameById(id){return new Promise(async res=>{const d=await openDB();d.transaction('games','readonly').objectStore('games').get(id).onsuccess=e=>res(e.target.result);});}

// UI Events
document.getElementById('uploadBtn').onclick=()=>document.getElementById('swfPicker').click();
document.getElementById('swfPicker').onchange=async e=>{if(e.target.files[0]) await importSwfFile(e.target.files[0]); e.target.value='';};
const dropHint=document.getElementById('dropHint');
dropHint.addEventListener('dragover',e=>{e.preventDefault();dropHint.style.borderColor='#66c0f4';});
dropHint.addEventListener('dragleave',e=>{e.preventDefault();dropHint.style.borderColor='rgba(255,255,255,0.03)';});
dropHint.addEventListener('drop',async e=>{e.preventDefault();dropHint.style.borderColor='rgba(255,255,255,0.03)';for(const f of Array.from(e.dataTransfer.files||[]).filter(f=>f.name.endsWith('.swf'))) await importSwfFile(f);});

document.getElementById('barToggle').onclick=toggleBar;
document.getElementById('closeBtn').onclick=closePlayer;
document.getElementById('favBtn').onclick=()=>toggleFav(currentId);
document.getElementById('downloadAllBtn').onclick=downloadAll;
document.getElementById('themeSelect').onchange=function(){setTheme(this.value);};

// Functions
async function importSwfFile(file){
    const id = uid();
    let arr;
    try{arr = await file.arrayBuffer();}catch(e){alert("Failed to read file!"); return;}
    const rec = {id,name:file.name.replace(/\.swf$/i,''),swf:arr,favorite:false};
    await storeGame(rec);
    index.unshift(rec); // Add to in-memory index immediately
    renderLibrary(); // Show in library
}

async function renderLibrary(){
    const q=(document.getElementById('search').value||'').toLowerCase();
    libraryEl.innerHTML='';
    const sorted=index.slice().sort((a,b)=>b.favorite-b.favorite);
    for(const meta of sorted){
        if(q&&!meta.name.toLowerCase().includes(q)) continue;
        const card=document.createElement('div');card.className='card';
        const cover=document.createElement('div');cover.className='cover';cover.style.backgroundColor='#222';
        const row=document.createElement('div');row.className='row';
        const nameDiv=document.createElement('div');nameDiv.className='name';nameDiv.textContent=meta.name;
        row.appendChild(nameDiv);card.appendChild(cover);card.appendChild(row);

        const dBtn=document.createElement('div');dBtn.className='cardBtn';dBtn.textContent='⬇';dBtn.title='Download';
        dBtn.onclick=async e=>{e.stopPropagation(); const rec=await getGameById(meta.id); const blob=new Blob([rec.swf],{type:'application/x-shockwave-flash'}); const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=rec.name+'.swf';a.click();};
        card.appendChild(dBtn);

        const delBtn=document.createElement('div');delBtn.className='cardBtn';delBtn.style.top='24px';delBtn.textContent='🗑';delBtn.title='Delete';
        delBtn.onclick=async e=>{e.stopPropagation(); if(confirm('Delete '+meta.name+'?')){await deleteGameDB(meta.id);index=index.filter(g=>g.id!==meta.id);renderLibrary(); if(currentId===meta.id) closePlayer();}};
        card.appendChild(delBtn);

        card.ondblclick=async e=>{e.stopPropagation(); const newName=prompt('Enter new name',meta.name); if(newName){meta.name=newName;await storeGame(meta);renderLibrary();}};
        card.onclick=()=>playFromIndex(meta.id);
        libraryEl.appendChild(card);
    }
}

async function playFromIndex(id){
    currentId=id;
    const rec=await getGameById(id);
    if(!rec){alert('Game missing'); return;}
    const blob = new Blob([rec.swf],{type:'application/x-shockwave-flash'});
    const url = URL.createObjectURL(blob);
    playerContainer.innerHTML='';
    const player = ruffleLib.createPlayer();
    player.style.width='100%';
    player.style.height='100%';
    playerContainer.appendChild(player);
    player.load(url);
    playerArea.style.display='flex';
    document.getElementById('barGameTitle').innerText=rec.name;
    document.getElementById('favBtn').innerText=rec.favorite?'★ Favorite':'☆ Favorite';
    toggleBarIfHidden(true);
}

async function toggleFav(id){if(!id)return; const rec=await getGameById(id); if(!rec)return; rec.favorite=!rec.favorite; await storeGame(rec); index=findIndexAndUpdate(rec); renderLibrary(); document.getElementById('favBtn').innerText=rec.favorite?'★ Favorite':'☆ Favorite';}
function findIndexAndUpdate(rec){const i=index.findIndex(x=>x.id===rec.id); if(i>-1)index[i]=rec; return index;}
function toggleBar(){barOpen=!barOpen;document.getElementById('controlBar').style.bottom=barOpen?'0':'-72px';document.getElementById('barToggle').innerText=barOpen?'▼':'▲';}
function toggleBarIfHidden(show){if(show&&!barOpen) toggleBar(); if(!show&&barOpen) toggleBar();}
function closePlayer(){playerContainer.innerHTML='';playerArea.style.display='none';currentId=null;document.getElementById('barGameTitle').innerText='No game';toggleBarIfHidden(false);}
async function downloadAll(){for(const g of index){const rec=await getGameById(g.id); const blob=new Blob([rec.swf],{type:'application/x-shockwave-flash'}); const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=rec.name+'.swf';a.click();}}
function setTheme(t){if(t==='dark'){document.documentElement.style.setProperty('--bg','#0f1720');document.documentElement.style.setProperty('--panel','#15232f');document.documentElement.style.setProperty('--accent','#66c0f4');document.documentElement.style.setProperty('--text','#d7e7ef');}
if(t==='light'){document.documentElement.style.setProperty('--bg','#f0f0f0');document.documentElement.style.setProperty('--panel','#e0e0e0');document.documentElement.style.setProperty('--accent','#1f7fff');document.documentElement.style.setProperty('--text','#101010');}
if(t==='blue'){document.documentElement.style.setProperty('--bg','#0a1a2f');document.documentElement.style.setProperty('--panel','#0f2a50');document.documentElement.style.setProperty('--accent','#66c0f4');document.documentElement.style.setProperty('--text','#d7e7ef');}}
</script>
</body>
</html>
